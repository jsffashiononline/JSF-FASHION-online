<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>অর্ডার | JSF FASHION</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><a class="brand" href="index.html"><img src="assets/logo-placeholder.svg"><span>JSF FASHION</span></a></header><main class="wrap narrow"><h1>অর্ডার নিশ্চিত করুন</h1><form id="checkoutForm" class="panel"><label>আপনার নাম<input name="name" required></label><label>মোবাইল নম্বর<input name="phone" required inputmode="tel"></label><label>সম্পূর্ণ ঠিকানা<textarea name="address" required></textarea></label><label>পেমেন্ট পদ্ধতি<select name="payment"><option>Cash on Delivery</option><option>bKash</option><option>Nagad</option></select></label><label>Transaction ID (প্রযোজ্য হলে)<input name="transactionId"></label><button class="btn">অর্ডার জমা দিন</button></form><p id="paymentInfo" class="muted"></p><p id="message"></p></main><script type="module" src="js/checkout.js"></script></body></html>
