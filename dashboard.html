<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | JSF FASHION</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><b>JSF FASHION — Admin</b><nav><a href="../index.html">ওয়েবসাইট</a><button id="logout" class="btn">Logout</button></nav></header><main class="admin-shell"><p id="notice" class="muted">অ্যাডমিন যাচাই হচ্ছে...</p><div class="admin-grid"><form id="productForm" class="panel"><h2>পণ্য যোগ / সম্পাদনা</h2><input name="id" type="hidden"><label>পণ্যের নাম<input name="name" required></label><label>দাম<input name="price" type="number" min="0" required></label><label>বর্ণনা<textarea name="description"></textarea></label><label>ছবি (ফোনের গ্যালারি)<input name="image" type="file" accept="image/*"></label><button class="btn" type="submit">পণ্য সংরক্ষণ</button></form><form id="settingsForm" class="panel"><h2>দোকানের সেটিংস</h2><label>দোকানের নাম<input id="storeNameSetting" value="JSF FASHION" readonly></label><label>bKash নম্বর<input name="bkash"></label><label>Nagad নম্বর<input name="nagad"></label><label>লোগো আপলোড<input name="logo" type="file" accept="image/*"></label><button class="btn" type="submit">সেটিংস সংরক্ষণ</button></form></div><section class="panel" style="margin-top:20px"><h2>পণ্যসমূহ</h2><div id="products"></div></section><section class="panel" style="margin-top:20px"><h2>অর্ডারসমূহ</h2><div id="orders"></div></section></main><script type="module" src="dashboard.js"></script></body></html>
