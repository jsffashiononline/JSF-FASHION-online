<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSF FASHION | Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <h2>JSF <span>FASHION</span> ADMIN</h2>
    <button id="logout-btn" class="danger hidden">Logout</button>
  </header>

  <main class="admin-container">
    <section id="login-section" class="panel login-panel">
      <h1>Admin Login</h1>
      <p>Sign in with your authorized Firebase account.</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Admin Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button class="gold-btn" type="submit">LOGIN</button>
      </form>
      <p id="login-message" class="message"></p>
    </section>

    <section id="dashboard" class="hidden">
      <h1>Dashboard</h1>
      <div class="stats-grid">
        <div class="stat-card"><span>Total Products</span><strong id="total-products">0</strong></div>
        <div class="stat-card"><span>Total Orders</span><strong id="total-orders">0</strong></div>
        <div class="stat-card"><span>Pending Orders</span><strong id="pending-orders">0</strong></div>
        <div class="stat-card"><span>Delivered Orders</span><strong id="delivered-orders">0</strong></div>
        <div class="stat-card"><span>Total Sales</span><strong id="total-sales">৳0</strong></div>
      </div>

      <section class="panel">
        <h2>Product Management</h2>
        <form id="product-form">
          <input type="hidden" id="product-id">
          <input id="product-name" placeholder="Product Name" required>
          <input id="product-price" type="number" min="0" placeholder="Price (BDT)" required>
          <input id="product-category" placeholder="Category" required>
          <input id="product-image" type="url" placeholder="Product Image URL" required>
          <input id="product-sizes" placeholder="Sizes separated by commas (S,M,L,XL)">
          <textarea id="product-description" placeholder="Product Description"></textarea>
          <button class="gold-btn" type="submit">SAVE PRODUCT</button>
          <button type="button" id="cancel-edit" class="secondary">CLEAR FORM</button>
        </form>
        <div id="admin-products"></div>
      </section>

      <section class="panel">
        <h2>Customer Orders</h2>
        <div id="admin-orders">Loading orders...</div>
      </section>

      <section class="panel">
        <h2>Store Settings</h2>
        <form id="settings-form">
          <label>bKash Number</label>
          <input id="bkash-number" placeholder="bKash Number">
          <label>Nagad Number</label>
          <input id="nagad-number" placeholder="Nagad Number">
          <label>Store Profile Picture URL</label>
          <input id="store-picture" type="url" placeholder="Image URL">
          <button class="gold-btn" type="submit">SAVE SETTINGS</button>
        </form>
        <p id="settings-message" class="message"></p>
      </section>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
