<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">JSF Circular Logo</title>
  <desc id="desc">JSF monogram in gold inside a navy circular badge.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a6"/><stop offset=".5" stop-color="#f5c400"/><stop offset="1" stop-color="#bd8b00"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b78"/><stop offset="1" stop-color="#07152e"/></linearGradient>
  </defs>
  <circle cx="120" cy="120" r="113" fill="url(#navy)" stroke="url(#gold)" stroke-width="7"/>
  <circle cx="120" cy="120" r="99" fill="none" stroke="#f5c400" stroke-opacity=".65" stroke-width="2"/>
  <path d="M52 158h136" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="143" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-7" fill="url(#gold)">JSF</text>
</svg>